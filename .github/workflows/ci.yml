name: DevSecOps CI Pipeline

on: [push, pull_request]

jobs:
  build:
    name: Build, SAST & SCA Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar construccion de la imagen (Build)
        run: docker build -t juice-shop-app .

      # 1. ETAPA SAST: Análisis Estático de Código Fuente
      - name: Ejecutar SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true # Quality Gate: Modo aviso
        with:
          config: >-
            p/security-audit
            p/secrets

      # 2. ETAPA SCA: Analisis de Dependencias SCA
      - name: Ejecutar SCA (Analisis de dependencias Node.js)
        continue-on-error: true # Quality Gate: Modo aviso
        run: |
          mkdir -p reports
          npm audit --json > reports/sca-dependencies-report.json || true
          npm audit > reports/sca-dependencies-report.txt || true

      # 3 etapa iac y contenedor analisis de imagen con trivy
      - name: Ejecutar IaC y seguridad de contenedor (Trivy)
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $(pwd)/reports:/reports aquasec/trivy:latest image --format json --output /reports/trivy-report.json --severity HIGH,CRITICAL juice-shop-app || true

      # 4 etapa staging despliegue de la aplicacion en entorno de pruebas
      - name: Iniciar aplicacion para pruebas dinamicas (Staging)
        run: |
          docker run -d -p 3000:3000 --name staging-app juice-shop-app
          echo "esperando disponibilidad de la aplicacion"
          timeout 60 bash -c 'until curl -s -f http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "aplicacion iniciada correctamente en http://localhost:3000"

      # 5 etapa dast analisis dinamico de seguridad web con owasp zap
      - name: Ejecutar DAST (OWASP ZAP)
        continue-on-error: true
        run: |
          docker run --rm --network="host" -v $(pwd)/reports:/zap/wrk:rw zaproxy/zap-stable zap-baseline.py -t http://localhost:3000 -J zap-report.json -r zap-report.html -I || true

      # archivar todos los informes de seguridad generados para defectdojo
      - name: Archivar informes de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      # 6 quality gate bloqueante de produccion segun figura cuatro del enunciado
      - name: Evaluar Quality Gate bloqueante
        run: |
          python3 -c "
          import json, sys
          with open('reports/sca-dependencies-report.json') as f:
              data = json.load(f)
              crit = data.get('metadata', {}).get('vulnerabilities', {}).get('critical', 0)
              high = data.get('metadata', {}).get('vulnerabilities', {}).get('high', 0)
              if crit > 0 or high > 0:
                  print(f'bloqueo de seguridad detectadas {crit} vulnerabilidades criticas y {high} altas')
                  print('el pipeline se detiene y no se despliega en produccion')
                  sys.exit(1)
          "          
