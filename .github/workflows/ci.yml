name: DevSecOps CI Pipeline

on: [push, pull_request]

jobs:
  build:
    name: Build, SAST & SCA Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Comprobar construcción de la imagen (Build)
        run: docker build -t juice-shop-app .

      # 1. ETAPA SAST: Análisis Estático de Código Fuente
      - name: Ejecutar SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true # Quality Gate: Modo aviso
        with:
          config: >-
            p/security-audit
            p/secrets

      # 2. ETAPA SCA: Analisis de Dependencias de Terceros
      - name: Ejecutar SCA (OWASP Dependency-Check)
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true # Quality Gate: Modo aviso
        with:
          project: 'OWASP Juice Shop'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >-
            --enableExperimental
            --scan package.json

      # Guardar el reporte como descargable
      - name: Archivar informe de SCA
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: 'reports/dependency-check-report.html'
