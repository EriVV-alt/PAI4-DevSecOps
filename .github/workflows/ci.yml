name: DevSecOps CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gate_max_critical:
        description: "Gate B: max. CRITICAL permitidos"
        default: "0"
      gate_max_high:
        description: "Gate B: max. HIGH permitidos"
        default: "0"

permissions:
  contents: read

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.186.0
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  ZAP_IMAGE: zaproxy/zap-stable:2.17.0

jobs:
  # etapa uno analisis estatico y construccion de imagen
  analisis_estatico:
    name: "1. Analisis estatico y Empaquetado"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: Preparar carpeta de informes
        run: mkdir -p reports && chmod 777 reports  # runner efimero; ZAP corre como usuario zap

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar IaC (Trivy config sobre Dockerfile y Terraform)
        continue-on-error: true # gate a modo aviso
        run: |
          docker run --rm -v $(pwd):/src -v $(pwd)/reports:/reports \
            $TRIVY_IMAGE config \
            --exit-code 1 \
            --format json --output /reports/trivy-iac-report.json \
            --severity LOW,MEDIUM,HIGH,CRITICAL /src

      - name: Ejecutar SAST (Semgrep)
        continue-on-error: true # Quality Gate: Modo aviso
        run: |
          docker run --rm -v "$(pwd):/src" $SEMGREP_IMAGE \
            semgrep scan --config p/security-audit --config p/secrets \
            --error --json --output /src/reports/semgrep-report.json /src

      - name: Ejecutar SCA (Analisis de dependencias Node.js)
        continue-on-error: true # Quality Gate: Modo aviso
        run: |
          npm audit --json > reports/sca-dependencies-report.json || EXIT_CODE=$?
          npm audit > reports/sca-dependencies-report.txt || true
          exit ${EXIT_CODE:-0}

      # construir imagen y exportar a tar sin exponer docker socket
      - name: Construir y exportar imagen Docker (Build)
        run: |
          docker build -t juice-shop:local .
          docker save juice-shop:local -o juice-shop.tar

      - name: Subir informes estaticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-static
          path: reports/

      - name: Subir imagen exportada
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-image
          path: juice-shop.tar
          retention-days: 1

  # etapa dos analisis del contenedor exportado
  contenedor:
    name: "2. Contenedor"
    needs: [analisis_estatico]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Preparar carpeta de informes
        run: mkdir -p reports

      - name: Descargar imagen exportada
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-image

      - name: Ejecutar seguridad de contenedor (Trivy image)
        continue-on-error: true # Quality Gate: Modo aviso
        run: |
          docker run --rm \
            -v "$(pwd)/juice-shop.tar:/juice-shop.tar:ro" \
            -v "$(pwd)/reports:/reports" \
            $TRIVY_IMAGE image \
            --input /juice-shop.tar \
            --format json \
            --output /reports/trivy-image-report.json \
            --severity HIGH,CRITICAL
            --exit-code 1

      - name: Subir informe de contenedor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-container
          path: reports/

  # etapa tres despliegue efimero en staging y pruebas dinamicas
  staging_dast:
    name: "3. Staging y DAST"
    needs: [contenedor]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Preparar carpeta de informes
        run: mkdir -p reports && chmod 777 reports

      - name: Descargar imagen exportada
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-image

      - name: Cargar imagen y levantar entorno Staging
        run: |
          docker load -i juice-shop.tar
          docker run -d -p 3000:3000 --name staging-app juice-shop:local
          echo "esperando disponibilidad de la aplicacion"
          timeout 60 bash -c 'until curl -s -f http://localhost:3000 > /dev/null; do sleep 2; done' || { docker logs staging-app; exit 1; }
          echo "aplicacion iniciada correctamente en http://localhost:3000"

      - name: Ejecutar DAST (OWASP ZAP)
        continue-on-error: true # Quality Gate: Modo aviso
        run: |
          docker run --rm --network=host -v $(pwd)/reports:/zap/wrk:rw \
             $ZAP_IMAGE zap-baseline.py -t http://localhost:3000 \
             -x zap-report.xml -r zap-report.html

      - name: Detener staging
        if: always()
        run: docker rm -f staging-app || true

      - name: Subir informe DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-dast
          path: reports/

  # etapa de gestion centralizada en defectdojo
  defectdojo:
    name: "Gestion centralizada: DefectDojo"
    needs: [analisis_estatico, contenedor, staging_dast]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: Descargar todos los informes de seguridad
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          merge-multiple: true
          path: reports

      - name: Subir informes a DefectDojo
        continue-on-error: true
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
        run: |
          python3 -c "import requests" 2>/dev/null || pip install --break-system-packages requests
          python3 scripts/upload_to_defectdojo.py

  # etapa cuatro evaluacion final de politicas
  evaluacion_politicas:
    name: "4. Evaluacion de Politicas"
    needs: [analisis_estatico, contenedor, staging_dast]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: Descargar todos los informes de seguridad
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          merge-multiple: true
          path: reports

      - name: Archivar informes consolidados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      - name: Quality Gate B (bloqueante)
        env:
          GATE_MAX_CRITICAL: ${{ github.event.inputs.gate_max_critical || '0' }}
          GATE_MAX_HIGH: ${{ github.event.inputs.gate_max_high || '0' }}
        run: python3 scripts/quality_gate.py