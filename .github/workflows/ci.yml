name: DevSecOps CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gate_max_critical:
        description: "Gate B: max. CRITICAL permitidos"
        default: "0"
      gate_max_high:
        description: "Gate B: max. HIGH permitidos"
        default: "0"

permissions:
  contents: read

jobs:
  build:
    name: DevSecOps Pipeline (Build, SAST, SCA, IaC, DAST, Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el codigo fuente
        uses: actions/checkout@v4

      - name: Preparar carpeta de informes
        run: mkdir -p reports && chmod 777 reports  # runner efimero; ZAP corre como usuario zap

      - name: Configurar entorno Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Comprobar construccion de la imagen (Build)
        run: docker build -t juice-shop-app .

      # 1. ETAPA SAST: Análisis Estático de Código Fuente
      - name: Ejecutar SAST (Semgrep)
        uses: semgrep/semgrep-action@v1
        continue-on-error: true # Quality Gate: Modo aviso
        with:
          config: >-
            p/security-audit
            p/secrets

      # 2. ETAPA SCA: Analisis de Dependencias SCA
      - name: Ejecutar SCA (Analisis de dependencias Node.js)
        continue-on-error: true # Quality Gate: Modo aviso
        run: |
          mkdir -p reports
          npm audit --json > reports/sca-dependencies-report.json || true
          npm audit > reports/sca-dependencies-report.txt || true

      # 3. IaC-Scan del Dockerfile
      - name: Ejecutar IaC (Trivy config sobre Dockerfile)
        continue-on-error: true # Quality Gate: Modo aviso
        run: |
          docker run --rm -v $(pwd):/src -v $(pwd)/reports:/reports \
            aquasec/trivy:latest config \
            --format json --output /reports/trivy-iac-report.json \
            --severity LOW,MEDIUM,HIGH,CRITICAL /src

      # 4. Container-Image-Scan
      - name: Ejecutar seguridad de contenedor (Trivy image)
        continue-on-error: true # Quality Gate: Modo aviso
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/reports:/reports aquasec/trivy:latest image \
            --format json --output /reports/trivy-image-report.json \
            --severity HIGH,CRITICAL juice-shop-app

      # 5 etapa staging despliegue de la aplicacion en entorno de pruebas
      - name: Iniciar aplicacion para pruebas dinamicas (Staging)
        run: |
          docker run -d -p 3000:3000 --name staging-app juice-shop-app
          echo "esperando disponibilidad de la aplicacion"
          timeout 60 bash -c 'until curl -s -f http://localhost:3000 > /dev/null; do sleep 2; done' || { docker logs staging-app; exit 1; }
          echo "aplicacion iniciada correctamente en http://localhost:3000"

      # 6 etapa dast analisis dinamico de seguridad web con owasp zap
      - name: Ejecutar DAST (OWASP ZAP)
        continue-on-error: true # Quality Gate: Modo aviso
        run: |
          docker run --rm --network=host -v $(pwd)/reports:/zap/wrk:rw \
            zaproxy/zap-stable zap-baseline.py -t http://localhost:3000 \
            -J zap-report.json -r zap-report.html -I

      - name: Detener staging
        if: always()
        run: docker rm -f staging-app || true

      # archivar todos los informes de seguridad generados para defectdojo
      - name: Archivar informes de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

      # quality gate bloqueante de produccion segun figura cuatro del enunciado
      - name: Quality Gate B (bloqueante)
        env:
          GATE_MAX_CRITICAL: ${{ github.event.inputs.gate_max_critical || '0' }}
          GATE_MAX_HIGH: ${{ github.event.inputs.gate_max_high || '0' }}
        run: python3 scripts/quality_gate.py